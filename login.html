<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plantora - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 360px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        /* Plantora Logo */
        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto 5px;
        }

        .brand-name {
            color: #2e7d32;
            font-size: 30px;
            font-weight: bold;
            margin: 0;
        }

        .tagline {
            color: #777;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 25px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #4caf50;
        }

        .remember {
            text-align: left;
            font-size: 14px;
            color: #555;
            margin: 10px 0;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #2e7d32;
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #1b5e20;
        }

        .back-home {
            display: block;
            margin-top: 18px;
            color: #2e7d32;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Plantora Logo -->
        <img
            src="Plantora.logo.png"
            alt="Plantora Logo"
            class="logo"
        >

        <h1 class="brand-name">PLANTORA</h1>

        <p class="tagline">
            Smart Plant Shopping & Care Assistance
        </p>

        <h2>Login</h2>

        <form id="loginForm">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <div class="remember">

                <input
                    type="checkbox"
                    id="rememberMe"
                >

                <label for="rememberMe">
                    Remember Me
                </label>

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Home
        </a>

    </div>

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                var username =
                    document
                    .getElementById("username")
                    .value
                    .trim();

                var password =
                    document
                    .getElementById("password")
                    .value
                    .trim();

                if (username && password) {

                    localStorage.setItem(
                        "plantoraUsername",
                        username
                    );

                    alert(
                        "Login successful! Welcome to Plantora 🌱"
                    );

                    window.location.href = "index.html";

                } else {

                    alert(
                        "Please enter both username and password."
                    );

                }

            });

    </script>

</body>

</html>
