<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Table Rose Plant - Plantora</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef7ee;
            margin: 0;
            padding: 40px 20px;
        }

        .card {
            width: 350px;
            margin: auto;
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
        }

        h1 {
            color: #2e7d32;
        }

        .description {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }

        .price {
            color: #2e7d32;
            font-size: 22px;
            font-weight: bold;
        }

        .btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #1b5e20;
        }

        .back {
            display: block;
            margin-top: 15px;
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="Table Rose.jpg" alt="Table Rose Plant">

        <h1>Table Rose Plant</h1>

        <p class="description">
            Beautiful flowering plant that adds colour and
            freshness to your home and garden.
        </p>

        <p class="price">
            Rs.45/-
        </p>

        <button class="btn" onclick="productBuy()">
            Buy Now
        </button>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

    <script>
        function productBuy() {
            window.location.href = "payment.html";
        }
    </script>

</body>

</html>
